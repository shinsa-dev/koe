    - text: .
  - heading "Download" [level=2] [ref=e38]
  - paragraph [ref=e39]:
    - text: Koe needs macOS 26 on Apple silicon.
    - link "shinsa.dev/koe/download" [ref=e40] [cursor=pointer]:
      - /url: https://shinsa.dev/koe/download
    - text: "always fetches the latest release. For every change as it lands, take the canary:"
    - link "shinsa.dev/koe/download/canary" [ref=e41] [cursor=pointer]:
      - /url: https://shinsa.dev/koe/download/canary
    - text: fetches the build of the latest merge to
    - code [ref=e42]: main
    - text: . Koe updates itself, and Settings switches between Stable and Canary at any time.
  - paragraph [ref=e43]: "The first time you open it, Koe asks for three permissions: the microphone to hear you, screen recording for screenshots and clips, and Accessibility for the Fn key and ⌘⇧-click. Allowing system audio is optional: it lets Koe pause music and videos while you talk."
