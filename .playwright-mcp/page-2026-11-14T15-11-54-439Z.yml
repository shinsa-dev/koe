  - heading "Introduction" [level=2] [ref=e17]
  - paragraph [ref=e18]:
    - text: Koe is a menu bar app for your Mac, part of
    - link "Shinsa" [ref=e19] [cursor=pointer]:
      - /url: https://github.com/shinsa-dev/shinsa
    - text: ", for talking to agents. You speak, and while you speak you comment on what is on screen, take screenshots, record clips and drop in files. When you stop, Koe copies one bundle: your words, with every attachment placed at the moment you added it. Paste it into Claude, ChatGPT, Slack or a terminal agent, and the agent reads each screenshot right where you talked about it."
  - paragraph [ref=e20]: Koe (声) means voice. It transcribes on device, on the Neural Engine, so nothing you say or capture leaves your Mac. The only things it downloads are the speech model and its own updates.
  - heading "How it works" [level=2] [ref=e21]
  - list [ref=e22]:
    - listitem [ref=e23]:
      - strong [ref=e24]: Speak.
      - text: Press Fn and the pill at the bottom of the screen starts listening straight away. Press it again to finish.
    - listitem [ref=e25]:
      - strong [ref=e26]: Comment.
      - text: ⌥⇧C freezes the screen; click anything and say what is wrong with it. Koe pins the spot and keeps your words with it. ⌘⇧-click does the same from anywhere and starts a session.
    - listitem [ref=e27]:
      - strong [ref=e28]: Screenshot.
      - text: ⌥⇧S picks a window or a region, and what you say next becomes its note.
    - listitem [ref=e29]:
      - strong [ref=e30]: Clip.
      - text: ⌥⇧R records part of the screen. Play it back slowly, step frame by frame and pick the frames that matter.
    - listitem [ref=e31]:
      - strong [ref=e32]: Drop files.
      - text: Drag any file onto the pill and it joins the session.
    - listitem [ref=e33]:
      - strong [ref=e34]: One bundle on the clipboard.
      - text: "Finish, press ⌘V anywhere, and your words and every attachment arrive in order. Nothing is lost if Koe quits mid-sentence: the recording is saved as it happens."
