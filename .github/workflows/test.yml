name: Test

# Every pull request runs every job, docs only too, so a required check never waits on a job a path filter skipped.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# FluidAudio 0.9 fails to compile on Xcode 26.4 and later (FluidInference/FluidAudio#415), so the jobs keep to 26.3
# until Koe moves to FluidAudio 0.13 or a runner has Xcode 27.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  # KoeCore and its tests alone, with no package to fetch or build. Without --disable-automatic-resolution, as the pins
  # in Package.resolved would make SwiftPM fetch every package the app uses; it drops the file from this checkout.
  core:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      KOE_CORE_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: .build/*
          key: core-${{ runner.os }}-xcode-26.3-${{ github.sha }}
          restore-keys: core-${{ runner.os }}-xcode-26.3-
      - run: python3 scripts/ci_source_times.py
      - run: swift test
      - if: github.event_name == 'push' || (github.event_name == 'pull_request' && steps.cache.outputs.cache-matched-key == '')
        uses: actions/cache/save@v4
        with:
          path: .build/*
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Budget
        if: ${{ !cancelled() }}
        run: scripts/ci-budget.sh 35

  # The whole app, so a compile error in Sources/Koe stays red. Main saves its build tree on every push, and a pull request run when it found none to restore; a
  # pull request starts from its own newest one, or main's; scripts/ci_source_times.py gives each file a time made from its content, so
  # only the files the pull request changed, and what depends on them, compile again. The cache lists `.build/*`, not `.build`: it archives a listed folder whole, so the
  # exclusion of the git mirrors only works on its children. The mirrors have a cache of their own, keyed on Package.resolved alone: without them SwiftPM
  # clones every package again (27 s), and they change only when a package does, so they are saved once per Package.resolved.
  app:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .build/*
            !.build/repositories
          key: app-${{ runner.os }}-xcode-26.3-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: app-${{ runner.os }}-xcode-26.3-${{ hashFiles('Package.resolved') }}-
      - id: mirrors
        uses: actions/cache/restore@v4
        with:
          path: .build/repositories
          key: app-mirrors-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
      - run: python3 scripts/ci_source_times.py
      - run: swift build --disable-automatic-resolution
      - if: steps.mirrors.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build/repositories
          key: ${{ steps.mirrors.outputs.cache-primary-key }}
      - if: github.event_name == 'push' || (github.event_name == 'pull_request' && steps.cache.outputs.cache-matched-key == '')
        uses: actions/cache/save@v4
        with:
          path: |
            .build/*
            !.build/repositories
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Budget
        if: ${{ !cancelled() }}
        run: scripts/ci-budget.sh 60

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Budget
        if: ${{ !cancelled() }}
        run: scripts/ci-budget.sh 15
