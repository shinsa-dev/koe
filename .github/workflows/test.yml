name: Test

on:
  push:
    branches: [main]
    paths: &tested
      - '**'
      - '!docs/**'
      - '!**/*.md'
  pull_request:
    paths: *tested

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  koe:
    runs-on: macos-26
    timeout-minutes: 30
    # FluidAudio 0.9 fails to compile on Xcode 26.4 and later (FluidInference/FluidAudio#415), so the job keeps to
    # 26.3 until Koe moves to FluidAudio 0.13 or a runner has Xcode 27.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - run: swift test --filter KoeCoreTests

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
